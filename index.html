<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIVERANK LKBB PENDEKAR 2026</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            brand: { 900: '#0a0a0f', 800: '#11111a', 700: '#1a1a24' }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background: radial-gradient(circle at top center, #1a2035 0%, #0a0a0f 50%, #050508 100%);
      color: #e2e8f0;
      height: 100vh;
      overflow: hidden;
    }

    /* Efek Kaca / Glassmorphism Antislope */
    .antislope-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      transition: all 0.3s ease;
    }
    
    .antislope-card:hover {
      border-color: rgba(96, 165, 250, 0.4);
      box-shadow: 0 0 20px rgba(96, 165, 250, 0.1);
    }

    /* Efek Glow Spesial untuk Top 3 */
    .top1-glow { border-color: rgba(250, 204, 21, 0.5) !important; box-shadow: 0 0 25px rgba(250, 204, 21, 0.15) !important; }
    .top2-glow { border-color: rgba(148, 163, 184, 0.5) !important; box-shadow: 0 0 25px rgba(148, 163, 184, 0.15) !important; }
    .top3-glow { border-color: rgba(217, 119, 6, 0.5) !important; box-shadow: 0 0 25px rgba(217, 119, 6, 0.15) !important; }

    /* Gradasi Teks */
    .text-gradient {
      background: linear-gradient(to right, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .text-gradient-blue {
      background: linear-gradient(to right, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Animasi Pendar Indikator Naik Turun */
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.8; }
    }
    .animate-glow { animation: pulseGlow 1.8s infinite; }
    .glow-green { filter: drop-shadow(0 0 8px #22c55e); }
    .glow-red { filter: drop-shadow(0 0 8px #ef4444); }
    .glow-yellow { filter: drop-shadow(0 0 8px #f59e0b); }

    /* Custom Scrollbar disembunyikan agar bersih */
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="flex flex-col p-4">

  <!-- HEADER -->
  <header class="flex items-center justify-between mb-4 antislope-card rounded-2xl p-4 shadow-2xl">
    <div class="flex items-center gap-4">
      <!-- Menggunakan logo lokal dari github sesuai instruksi -->
      <img src="logo-pendekar.png" alt="Logo Pendekar" class="h-14 opacity-90 drop-shadow-[0_0_10px_rgba(255,255,255,0.2)]">
      <div>
        <div class="inline-flex items-center gap-2 bg-white/5 border border-white/10 rounded-full px-3 py-1 mb-1 shadow-inner">
          <span class="relative flex h-2 w-2">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
          </span>
          <span class="text-[9px] font-bold tracking-widest text-emerald-400 uppercase">SYSTEM SYNCED</span>
        </div>
        <div class="text-xs text-slate-400 font-semibold" id="last-update-clock">Last Sync: --:--:-- WIB</div>
      </div>
    </div>

    <div class="text-center">
      <h1 class="text-3xl md:text-4xl font-black tracking-tight text-gradient drop-shadow-md">
        LIVE RANK LKBB PENDEKAR <span class="text-gradient-blue">2026</span>
      </h1>
      <p class="text-[10px] font-bold text-slate-400 tracking-[0.2em] uppercase mt-1">
        SUPPORTED BY REKAP ANDALAN
      </p>
    </div>

    <div class="flex items-center gap-4 text-right">
      <div class="text-xl font-black text-white tracking-wider drop-shadow-md" id="live-realtime-clock">00:00:00</div>
    </div>
  </header>

  <!-- KONTEN UTAMA: 2 KOLOM (SMP & SMA) -->
  <main class="flex-1 grid grid-cols-2 gap-6 overflow-hidden">
    
    <!-- KOLOM SMP -->
    <div class="flex flex-col h-full bg-brand-800/40 rounded-3xl border border-white/5 p-4 overflow-hidden shadow-2xl">
      <h2 class="text-center text-xl font-black text-white tracking-[0.15em] uppercase mb-4 antislope-card rounded-xl py-2 drop-shadow-sm">
        KATEGORI SMP / MTs
      </h2>
      <div class="flex-1 overflow-hidden flex flex-col" id="card-smp"></div>
    </div>

    <!-- KOLOM SMA -->
    <div class="flex flex-col h-full bg-brand-800/40 rounded-3xl border border-white/5 p-4 overflow-hidden shadow-2xl">
      <h2 class="text-center text-xl font-black text-white tracking-[0.15em] uppercase mb-4 antislope-card rounded-xl py-2 drop-shadow-sm">
        KATEGORI SMA / SMK / MA
      </h2>
      <div class="flex-1 overflow-hidden flex flex-col" id="card-sma"></div>
    </div>

  </main>

  <script>
    // ⚠️ MASUKKAN LINK DEPLOY GOOGLE APPS SCRIPT YANG BARU DI SINI
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzTSP4qFth4q0Ufjbag-uq_WFh2-jHvQ0RY9w4e8oemtdwlw_PPL99z3FZ7Aec1-C4h/exec";

    let liveData = { smp: [], sma: [] };
    let teamRankTracker = { smp: {}, sma: {} };
    
    // Batas peserta sesuai instruksi: SMP 16, SMA 33
    const tabLimits = { smp: 16, sma: 33 };
    let lastDataSyncTime = 0;

    function isCategoryComplete(cat) {
      const maxLimit = tabLimits[cat];
      const items = (liveData[cat] || []).slice(0, maxLimit);
      if (items.length < maxLimit) return false;
      return items.every(item => item.totalNilai && item.totalNilai > 0);
    }

    function getTrendIndicatorHTML(cat, item, currentIndex) {
      if (!item || !item.totalNilai || item.totalNilai <= 0) return `<span class="w-5"></span>`;

      const teamKey = item.noUrut || item.rank || `item-${currentIndex}`;
      const now = Date.now();

      if (!teamRankTracker[cat]) teamRankTracker[cat] = {};
      const prevData = teamRankTracker[cat][teamKey];

      let status = 'up';
      let lastChangeTime = now;

      if (prevData !== undefined) {
        if (currentIndex < prevData.rankIndex) {
          status = 'up'; lastChangeTime = now;
        } else if (currentIndex > prevData.rankIndex) {
          status = 'down'; lastChangeTime = now;
        } else {
          status = prevData.status || 'same';
          lastChangeTime = prevData.lastChangeTime || now;
        }
      }

      teamRankTracker[cat][teamKey] = { rankIndex: currentIndex, status: status, lastChangeTime: lastChangeTime };
      const categoryFinished = isCategoryComplete(cat);

      // Sembunyikan indikator jika sudah lewat 5 menit (300.000 ms) dan kategori belum final
      if (!categoryFinished && (now - lastChangeTime) > (5 * 60 * 1000)) {
        return `<span class="w-5"></span>`;
      }

      if (status === 'up') return `<span class="text-emerald-400 font-black text-sm md:text-base animate-glow glow-green w-5 text-center leading-none">▲</span>`;
      if (status === 'down') return `<span class="text-rose-400 font-black text-sm md:text-base animate-glow glow-red w-5 text-center leading-none">▼</span>`;
      return `<span class="text-amber-400 font-black text-xs md:text-sm animate-glow glow-yellow w-5 text-center leading-none">■</span>`;
    }

    function buildPodiumCard(item, i, cat) {
      const data = item || { rank: i+1, totalNilai: 0, noUrut: '-', namaSekolah: '-' };
      const indicatorHtml = getTrendIndicatorHTML(cat, data, i);
      
      let glowClass = 'antislope-card';
      let trophy = '';
      if(i === 0) { glowClass += ' top1-glow'; trophy = '🏆'; }
      if(i === 1) { glowClass += ' top2-glow'; trophy = '🥈'; }
      if(i === 2) { glowClass += ' top3-glow'; trophy = '🥉'; }

      // Rank menggunakan angka 1, 2, 3 (atau dari data jika ada)
      const rankNum = data.rank || (i+1);

      return `
        <div class="relative ${glowClass} rounded-2xl p-3 flex flex-col justify-center shadow-lg h-[95px]">
          <div class="flex items-center justify-between w-full h-full">
            
            <!-- Kolom Rank Kiri -->
            <div class="flex items-center gap-1.5 w-[65px]">
              <span class="text-2xl font-black text-white drop-shadow-md leading-none">${trophy} ${rankNum}</span>
            </div>

            <!-- Indikator Naik Turun (Tengah Kiri) -->
            <div class="flex items-center justify-center w-6">
              ${indicatorHtml}
            </div>

            <!-- Kolom No Tampil & Sekolah (Tengah) -->
            <div class="flex-1 flex flex-col items-center justify-center border-x border-white/10 px-2 mx-1 h-full">
              <span class="text-[10px] text-slate-400 uppercase tracking-widest leading-none mb-0.5">NO TAMPIL</span>
              <span class="text-2xl font-black text-white leading-none">${data.noUrut}</span>
              <span class="text-[9px] font-semibold text-slate-400 truncate w-full text-center mt-1 uppercase">${data.namaSekolah}</span>
            </div>

            <!-- Kolom Nilai Total (Kanan) -->
            <div class="w-[75px] text-right flex flex-col items-end justify-center">
              <span class="text-[10px] text-slate-400 uppercase tracking-widest leading-none mb-0.5">TOTAL</span>
              <div class="text-2xl font-black text-blue-400 drop-shadow-[0_0_8px_rgba(96,165,250,0.5)] leading-none">${data.totalNilai || '0'}</div>
            </div>

          </div>
        </div>
      `;
    }

    function buildListTable(items, cat, startIndex) {
      if (items.length === 0) return '';
      const rows = items.map((item, idx) => {
        const actualIndex = startIndex + idx;
        const indicatorHtml = getTrendIndicatorHTML(cat, item, actualIndex);
        
        return `
          <div class="flex items-center justify-between antislope-card rounded-xl p-2.5 mb-2 hover:bg-white/5 transition-all group">
            
            <!-- RANK -->
            <div class="flex items-center gap-2 w-14">
              <span class="text-base font-black text-slate-400 w-6 text-center leading-none group-hover:text-white transition-colors">${item.rank || (actualIndex + 1)}</span>
              ${indicatorHtml}
            </div>
            
            <!-- NO TAMPIL -->
            <div class="flex-1 flex flex-col items-center justify-center border-x border-white/10 px-2">
               <span class="text-xl font-black text-white leading-none">${item.noUrut || '-'}</span>
               <span class="text-[9px] font-bold text-slate-400 truncate w-full text-center mt-1 uppercase group-hover:text-blue-200 transition-colors">${item.namaSekolah || '-'}</span>
            </div>
            
            <!-- TOTAL NILAI -->
            <div class="text-lg font-black text-blue-400 w-[70px] text-right pr-2 leading-none group-hover:text-blue-300 transition-colors">${item.totalNilai || '0'}</div>
          </div>
        `;
      }).join('');

      return `
        <div class="flex flex-col h-full w-full">
           <!-- Header Tabel -->
           <div class="flex text-[10px] font-bold text-slate-500 uppercase tracking-widest px-3 mb-2">
              <div class="w-14">RANK</div>
              <div class="flex-1 text-center">NO TAMPIL</div>
              <div class="w-[70px] text-right pr-2">TOTAL</div>
           </div>
           
           <!-- Isi Tabel (Scrollable) -->
           <div class="overflow-y-auto flex-1 hide-scrollbar px-1">
              ${rows}
           </div>
        </div>
      `;
    }

    function renderCategory(cat) {
      const container = document.getElementById(`card-${cat}`);
      container.innerHTML = '';

      const maxLimit = tabLimits[cat];
      const items = (liveData[cat] || []).slice(0, maxLimit);
      if (items.length === 0) return;

      const top3 = items.slice(0, 3);
      const remainingItems = items.slice(3);

      // --- 1. RENDER PODIUM TOP 3 ---
      const podiumWrapper = document.createElement('div');
      podiumWrapper.className = "flex flex-col gap-2.5 mb-4 w-full"; // Dibuat stack ke bawah untuk podium agar lebih rapi di layout ini
      podiumWrapper.innerHTML = `
        ${buildPodiumCard(top3[0], 0, cat)}
        <div class="grid grid-cols-2 gap-2.5">
          ${buildPodiumCard(top3[1], 1, cat)}
          ${buildPodiumCard(top3[2], 2, cat)}
        </div>
      `;
      container.appendChild(podiumWrapper);

      // --- 2. RENDER DAFTAR SISANYA (2 KOLOM) ---
      if (remainingItems.length > 0) {
        const tablesGrid = document.createElement('div');
        tablesGrid.className = "grid grid-cols-2 gap-4 flex-1 overflow-hidden pt-2 border-t border-white/10";
        
        const mid = Math.ceil(remainingItems.length / 2);
        const leftList = remainingItems.slice(0, mid);
        const rightList = remainingItems.slice(mid);

        tablesGrid.innerHTML = `
          <div class="h-full overflow-hidden">${buildListTable(leftList, cat, 3)}</div>
          <div class="h-full overflow-hidden">${buildListTable(rightList, cat, 3 + leftList.length)}</div>
        `;
        
        container.appendChild(tablesGrid);
      }
    }

    // Jam Realtime
    function updateClocks() {
      const now = new Date();
      document.getElementById('live-realtime-clock').innerText = now.toLocaleTimeString('id-ID', { hour12: false });
    }
    setInterval(updateClocks, 1000);
    updateClocks();

    // Fetch Data dari API
    async function fetchData() {
      if(GAS_API_URL === "MASUKKAN_LINK_DEPLOY_BARU_DI_SINI") return; // Cegah error jika URL belum diganti
      try {
        const response = await fetch(GAS_API_URL);
        const data = await response.json();
        
        liveData = data;

        // Update indikator waktu sinkronisasi (Waktu dari panitia klik "Sync")
        if(data.lastSync && data.lastSync !== lastDataSyncTime) {
           lastDataSyncTime = data.lastSync;
           const syncDate = new Date(data.lastSync);
           document.getElementById('last-update-clock').innerText = `Last Sync: ${syncDate.toLocaleTimeString('id-ID', { hour12: false })} WIB`;
        }

        renderCategory('smp');
        renderCategory('sma');
      } catch (error) {
        console.error("Gagal sinkronisasi data:", error);
      }
    }

    // Polling setiap 5 detik ke Web App API
    fetchData();
    setInterval(fetchData, 5000);
  </script>
</body>
</html>
