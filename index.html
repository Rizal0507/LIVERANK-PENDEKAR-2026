<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIVERANK LKBB PENDEKAR 2026</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            brand: { 900: '#060813', 800: '#0a0d1c', 700: '#11162b', card: '#0f1423' }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background: radial-gradient(circle at top center, #11162b 0%, #060813 100%);
      color: #e2e8f0;
      height: 100vh;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    .flash-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      box-shadow: inset 0 0 0 0 rgba(255, 255, 255, 0);
      pointer-events: none; z-index: 9999;
    }
    .is-flashing { animation: smoothGlow 2.5s ease-out; }
    @keyframes smoothGlow {
      0% { box-shadow: inset 0 0 0 0 rgba(255, 255, 255, 0); }
      30% { box-shadow: inset 0 0 0 40px rgba(255, 255, 255, 0.15); }
      100% { box-shadow: inset 0 0 0 0 rgba(255, 255, 255, 0); }
    }

    .anim-item { 
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); 
      position: relative;
    }

    .rank-text {
      white-space: nowrap;
      overflow: visible;
      letter-spacing: 0.02em;
    }

    /* Ukuran card diperbesar untuk mengisi gap bawah */
    .rank-card {
      background: rgba(15, 20, 35, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 6px;
    }
    .podium-card { background: rgba(15, 20, 35, 0.8); border-radius: 8px; }
    .top1-glow { border: 1px solid rgba(250, 204, 21, 0.3); }
    .top2-glow { border: 1px solid rgba(148, 163, 184, 0.3); }
    .top3-glow { border: 1px solid rgba(217, 119, 6, 0.3); }

    .no-box {
      border: 1px solid rgba(96, 165, 250, 0.35);
      border-radius: 4px;
      background: rgba(96, 165, 250, 0.08);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer; /* Menandakan bisa diklik */
      transition: all 0.3s ease;
    }
    .no-box:hover {
      background: rgba(96, 165, 250, 0.2);
    }
    .no-box.followed {
      background: rgba(250, 204, 21, 0.2);
      border-color: rgba(250, 204, 21, 0.6);
      color: #facc15;
    }

    .text-gradient { background: linear-gradient(to right, #ffffff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .text-gradient-blue { background: linear-gradient(to right, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .no-scroll { overflow: hidden; }

    /* Pengaturan tampilan mobile */
    @media (max-width: 1024px) {
      body { height: auto; overflow: auto; }
      .mobile-tab-hidden { display: none !important; }
    }
  </style>
</head>
<body class="flex flex-col p-2 lg:p-4">

  <div id="screen-flash" class="flash-overlay"></div>

  <!-- OVERLAY SPONSOR -->
  <div id="sponsor-overlay" class="fixed inset-0 z-[100] bg-brand-900/95 backdrop-blur-xl flex flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity duration-700">
    <h2 class="text-sm font-black text-slate-500 tracking-[0.3em] uppercase mb-12">OUR PROUD SPONSORS</h2>
    <div id="sponsor-content" class="flex flex-col items-center text-center transition-opacity duration-500" style="opacity: 0;">
      <!-- TEMPAT LINK SPONSOR: Gambar logo sponsor akan muncul di sini. Data diambil dari variabel sponsorData di bagian bawah -->
      <img id="sponsor-img" src="" alt="Sponsor" class="h-40 md:h-56 object-contain mb-8">
      <h3 id="sponsor-name" class="text-3xl md:text-5xl font-black text-white tracking-widest uppercase text-gradient mb-4"></h3>
      <p id="sponsor-desc" class="text-base md:text-xl text-slate-400 font-medium"></p>
    </div>
    <button onclick="hidePromo()" class="absolute top-8 right-8 text-white/30 hover:text-white/80 text-3xl transition-colors"><i class="fa-solid fa-xmark"></i></button>
  </div>

  <!-- HEADER UTAMA -->
  <header class="flex flex-col lg:flex-row items-center justify-between mb-3 bg-brand-800/50 border border-white/5 rounded-2xl p-3 shadow-lg shrink-0 z-10 sticky top-0 backdrop-blur-md">
    <div class="flex items-center justify-between w-full lg:w-auto gap-4">
      <img src="logo-pendekar.png" alt="Logo Pendekar" class="h-10 lg:h-12 object-contain">
      <div class="text-center flex-1 lg:hidden">
        <h1 class="text-xl font-black tracking-tight text-gradient leading-none mb-1">
          LIVE RANK LKBB PENDEKAR <span class="text-gradient-blue">2026</span>
        </h1>
      </div>
      <div class="lg:hidden text-lg font-black text-white tracking-wider" id="live-realtime-clock-mobile">00:00:00</div>

    <div class="text-center hidden lg:block flex-1">
      <h1 class="text-2xl lg:text-3xl font-black tracking-tight text-gradient leading-none mb-1">
        LIVE RANK LKBB PENDEKAR <span class="text-gradient-blue">2026</span>
      </h1>
      <!-- TEMPAT LINK SUPPORTED BY: Teks ini bisa diganti dengan tag <img> jika ingin menggunakan logo. Contoh: <img src="link-gambar.jpg" class="h-6 mx-auto"> -->
      <div class="text-[9px] font-bold text-slate-500 tracking-[0.2em] uppercase">SUPPORTED BY REKAP ANDALAN</div>
    </div>

    <div class="flex flex-col lg:flex-row items-center gap-4 mt-3 lg:mt-0 w-full lg:w-auto">
      <div class="flex items-center justify-center gap-4 w-full lg:w-auto">
        <div class="flex flex-col justify-center items-center lg:items-start">
          <div class="inline-flex items-center gap-2 bg-white/5 border border-white/10 rounded-full px-2 py-0.5 mb-1">
            <span class="relative flex h-1.5 w-1.5"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span><span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-emerald-500"></span></span>
            <span class="text-[9px] font-bold tracking-widest text-emerald-400 uppercase">SYSTEM SYNCED</span>
          </div>
          <div class="text-[9px] text-slate-400 font-semibold" id="last-update-clock">Last Sync: --:--:-- WIB</div>
        </div>
      </div>
      
      <!-- TAB MOBILE -->
      <div class="flex lg:hidden w-full gap-2 mt-2">
        <button onclick="switchTab('smp')" id="tab-btn-smp" class="flex-1 py-2 bg-[#60a5fa]/20 border border-[#60a5fa]/50 text-[#60a5fa] rounded-lg text-xs font-bold transition-all">SMP / MTs</button>
        <button onclick="switchTab('sma')" id="tab-btn-sma" class="flex-1 py-2 bg-white/5 border border-white/10 text-slate-400 rounded-lg text-xs font-bold transition-all">SMA / SMK / MA</button>
      </div>

      <div class="hidden lg:flex items-center gap-4 h-full text-right">
        <div class="text-lg lg:text-xl font-black text-white tracking-wider" id="live-realtime-clock">00:00:00</div>
        <!-- LOGO REKAP ANDALAN DIPERBESAR (h-16) -->
        <img src="https://lh3.googleusercontent.com/d/1UHSI3CLB0YCZ7uQ3O0sVIGMrVeK7qrK0=s1000" alt="Rekap Andalan" class="h-16 object-contain">
      </div>
    </div>
  </header>

  <!-- KONTEN UTAMA -->
  <main class="flex-1 grid grid-cols-1 lg:grid-cols-2 gap-3 lg:gap-4 min-h-0 pb-1">
    
    <!-- KOLOM SMP -->
    <div id="col-smp" class="flex flex-col lg:flex-row h-full bg-brand-800/30 rounded-2xl border border-white/5 p-2 shadow-xl gap-2.5">
      <div class="hidden lg:flex items-center justify-center w-8 lg:w-10 bg-white/5 rounded-xl border border-white/10 shrink-0 py-4">
        <h2 class="text-sm lg:text-base font-black text-white tracking-[0.3em] uppercase whitespace-nowrap" style="writing-mode: vertical-rl; transform: rotate(180deg);">
          SMP / MTs
        </h2>
      </div>
      
      <div class="flex-1 flex flex-col min-w-0">
        <div id="podium-smp" class="grid grid-cols-3 gap-2 mb-2 shrink-0"></div>
        <div class="flex-1 flex flex-col lg:flex-row min-h-0 gap-2 border-t border-white/5 pt-2">
           <div class="flex-1 flex flex-col min-h-0">
              <div class="grid grid-cols-[100px_1fr_40px] lg:grid-cols-[120px_1fr_50px] items-center text-[10px] font-bold text-slate-500 uppercase tracking-widest px-2 mb-1 shrink-0 bg-white/5 rounded py-1 gap-1">
                 <div class="text-left">RANK</div>
                 <div class="text-center">NO. TAMPIL</div>
                 <div class="text-right">TOTAL</div>
              </div>
              <div id="list-smp-col1" class="w-full flex flex-col gap-1.5 relative flex-1 min-h-0"></div>
           </div>
           <div class="flex-1 flex flex-col min-h-0">
              <div class="grid grid-cols-[100px_1fr_40px] lg:grid-cols-[120px_1fr_50px] items-center text-[10px] font-bold text-slate-500 uppercase tracking-widest px-2 mb-1 shrink-0 bg-white/5 rounded py-1 gap-1">
                 <div class="text-left">RANK</div>
                 <div class="text-center">NO. TAMPIL</div>
                 <div class="text-right">TOTAL</div>
              </div>
              <div id="list-smp-col2" class="w-full flex flex-col gap-1.5 relative flex-1 min-h-0"></div>
           </div>
        </div>
      </div>
    </div>

    <!-- KOLOM SMA -->
    <div id="col-sma" class="flex flex-col lg:flex-row h-full bg-brand-800/30 rounded-2xl border border-white/5 p-2 shadow-xl gap-2.5 mobile-tab-hidden">
      <div class="hidden lg:flex items-center justify-center w-8 lg:w-10 bg-white/5 rounded-xl border border-white/10 shrink-0 py-4">
        <h2 class="text-sm lg:text-base font-black text-white tracking-[0.3em] uppercase whitespace-nowrap" style="writing-mode: vertical-rl; transform: rotate(180deg);">
          SMA / SMK / MA
        </h2>
      </div>
      
      <div class="flex-1 flex flex-col min-w-0">
        <div id="podium-sma" class="grid grid-cols-3 gap-2 mb-2 shrink-0"></div>
        <div class="flex-1 flex flex-col lg:flex-row min-h-0 gap-2 border-t border-white/5 pt-2">
           <div class="flex-1 flex flex-col min-h-0">
              <div class="grid grid-cols-[100px_1fr_40px] lg:grid-cols-[120px_1fr_50px] items-center text-[10px] font-bold text-slate-500 uppercase tracking-widest px-2 mb-1 shrink-0 bg-white/5 rounded py-1 gap-1">
                 <div class="text-left">RANK</div>
                 <div class="text-center">NO. TAMPIL</div>
                 <div class="text-right">TOTAL</div>
              </div>
              <div id="list-sma-col1" class="w-full flex flex-col gap-1.5 relative flex-1 min-h-0"></div>
           </div>
           <div class="flex-1 flex flex-col min-h-0">
              <div class="grid grid-cols-[100px_1fr_40px] lg:grid-cols-[120px_1fr_50px] items-center text-[10px] font-bold text-slate-500 uppercase tracking-widest px-2 mb-1 shrink-0 bg-white/5 rounded py-1 gap-1">
                 <div class="text-left">RANK</div>
                 <div class="text-center">NO. TAMPIL</div>
                 <div class="text-right">TOTAL</div>
              </div>
              <div id="list-sma-col2" class="w-full flex flex-col gap-1.5 relative flex-1 min-h-0"></div>
           </div>
        </div>
      </div>
    </div>

  </main>

  <button onclick="showPromo()" class="fixed bottom-3 right-3 opacity-10 hover:opacity-100 bg-white/10 p-2 rounded-full text-white transition-all z-[90]">
    <i class="fa-solid fa-star"></i>
  </button>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzTSP4qFth4q0Ufjbag-uq_WFh2-jHvQ0RY9w4e8oemtdwlw_PPL99z3FZ7Aec1-C4h/exec";

    // TEMPAT LINK SPONSOR: Ganti URL di bagian 'logo' dengan link gambar/logo sponsor yang diinginkan
    const sponsorData = [
      { logo: "https://lh3.googleusercontent.com/d/185LBG7napo7sSUDR29NBOi179fN1dbep=s1000", nama: "TJOBRUT STORE", deskripsi: "Pusat Atribut Paskibra Terlengkap dan Termurah" },
      { logo: "https://lh3.googleusercontent.com/d/1S8ycvcUE99tn-w7TKXPJ5lRlbWowuwIb=s1000", nama: "COSMO ATRIBUT", deskripsi: "" }
    ];

    let followedParticipants = new Set();
    
    function toggleFollow(noUrut) {
      if(followedParticipants.has(noUrut)) {
        if(confirm(`Batal mengikuti peserta nomor ${noUrut}?`)) {
          followedParticipants.delete(noUrut);
          renderCategorySMP(); renderCategorySMA();
        }
      } else {
        if(confirm(`Ikuti peserta nomor urut ${noUrut}?`)) {
          followedParticipants.add(noUrut);
          renderCategorySMP(); renderCategorySMA();
        }
      }
    }

    function switchTab(tab) {
      if(window.innerWidth >= 1024) return;
      const colSmp = document.getElementById('col-smp');
      const colSma = document.getElementById('col-sma');
      const btnSmp = document.getElementById('tab-btn-smp');
      const btnSma = document.getElementById('tab-btn-sma');

      if(tab === 'smp') {
        colSmp.classList.remove('mobile-tab-hidden'); colSma.classList.add('mobile-tab-hidden');
        btnSmp.className = "flex-1 py-2 bg-[#60a5fa]/20 border border-[#60a5fa]/50 text-[#60a5fa] rounded-lg text-xs font-bold transition-all";
        btnSma.className = "flex-1 py-2 bg-white/5 border border-white/10 text-slate-400 rounded-lg text-xs font-bold transition-all";
      } else {
        colSma.classList.remove('mobile-tab-hidden'); colSmp.classList.add('mobile-tab-hidden');
        btnSma.className = "flex-1 py-2 bg-[#60a5fa]/20 border border-[#60a5fa]/50 text-[#60a5fa] rounded-lg text-xs font-bold transition-all";
        btnSmp.className = "flex-1 py-2 bg-white/5 border border-white/10 text-slate-400 rounded-lg text-xs font-bold transition-all";
      }
    }

    let promoTimer = null; let promoIsActive = false;
    function showPromo() {
      if(sponsorData.length === 0 || promoIsActive) return;
      promoIsActive = true;
      const overlay = document.getElementById('sponsor-overlay'); const content = document.getElementById('sponsor-content');
      overlay.classList.remove('opacity-0', 'pointer-events-none'); overlay.classList.add('opacity-100');
      let idx = 0;
      function showNextSponsor() {
        if(idx >= sponsorData.length || !promoIsActive) { hidePromo(); return; }
        content.style.opacity = 0;
        setTimeout(() => {
          document.getElementById('sponsor-img').src = sponsorData[idx].logo;
          document.getElementById('sponsor-name').innerText = sponsorData[idx].nama;
          const descEl = document.getElementById('sponsor-desc');
          descEl.innerText = sponsorData[idx].deskripsi; descEl.style.display = sponsorData[idx].deskripsi ? "block" : "none";
          content.style.opacity = 1; idx++;
          promoTimer = setTimeout(showNextSponsor, 5000);
        }, 500);
      }
      showNextSponsor();
    }
    function hidePromo() {
      promoIsActive = false; clearTimeout(promoTimer);
      const overlay = document.getElementById('sponsor-overlay');
      overlay.classList.remove('opacity-100'); overlay.classList.add('opacity-0', 'pointer-events-none');
    }
    setInterval(showPromo, 15 * 60 * 1000);

    let liveData = { smp: [], sma: [] };
    let previousFullSignature = { smp: "", sma: "" };
    let teamRankTracker = { smp: {}, sma: {} };
    const tabLimits = { smp: 16, sma: 33 };
    let lastDataSyncTime = 0; let isUpdating = false;

    function getIndicatorData(cat, item, currentIndex) {
      if (!item || !item.totalNilai || item.totalNilai <= 0) return `<span class="text-slate-500 font-bold text-[10px]">—</span>`;
      
      const teamKey = item.noUrut;
      if (!teamRankTracker[cat]) teamRankTracker[cat] = {};
      const prevData = teamRankTracker[cat][teamKey];

      let status = 'same';
      if (prevData !== undefined) {
        if (currentIndex < prevData.rankIndex) { status = 'up'; } 
        else if (currentIndex > prevData.rankIndex) { status = 'down'; } 
        else { status = 'same'; }
      }
      teamRankTracker[cat][teamKey] = { rankIndex: currentIndex, status: status };

      if (status === 'up') return `<span class="text-[#10b981] font-black text-[12px] leading-none">▲</span>`;
      if (status === 'down') return `<span class="text-[#ef4444] font-black text-[12px] leading-none">▼</span>`;
      return `<span class="text-slate-500 font-bold text-[12px]">—</span>`;
    }

    function buildCard(item, cat, actualIndex, isPodium = false) {
      const data = item || { rank: actualIndex+1, totalNilai: '0', noUrut: '-' };
      const indicatorHtml = getIndicatorData(cat, data, actualIndex);
      
      let displayNo = data.noUrut;
      if (!isNaN(displayNo) && displayNo !== '-' && displayNo > 0 && displayNo < 10) { 
          displayNo = '0' + parseInt(displayNo); 
      }
      
      const rankStr = data.rank || (actualIndex + 1);
      const isFollowed = followedParticipants.has(displayNo);
      const starHtml = isFollowed ? '★' : displayNo;
      const followClass = isFollowed ? 'followed' : '';

      if (isPodium) {
        let glowClass = 'podium-card px-2 py-2 h-[55px] lg:h-[60px] flex flex-col justify-between anim-item w-full shrink-0';
        if(actualIndex === 0) glowClass += ' top1-glow';
        if(actualIndex === 1) glowClass += ' top2-glow';
        if(actualIndex === 2) glowClass += ' top3-glow';
        const trophy = ['🏆','🥈','🥉'][actualIndex] || '';

        return `
          <div class="${glowClass}" data-id="${data.noUrut || actualIndex}">
            <div class="flex justify-between items-center w-full px-1">
               <span class="text-[11px] lg:text-[12px] font-bold text-white rank-text uppercase">${trophy} ${rankStr}</span>
            </div>
            <div class="flex justify-between items-center w-full px-1 mt-0.5">
               <div onclick="toggleFollow('${displayNo}')" class="no-box ${followClass} px-2 py-0.5 h-[22px]" title="Klik untuk mengikuti/menandai peserta">
                  <span class="text-[12px] font-bold leading-none">${starHtml}</span>
               </div>
               <div class="flex items-center gap-2">
                  <div class="w-[14px] text-center flex items-center justify-center">${indicatorHtml}</div>
                  <span class="text-[14px] lg:text-[16px] font-black text-[#60a5fa] leading-none">${data.totalNilai || '0'}</span>
               </div>
            </div>
          </div>
        `;
      }

      return `
        <div class="rank-card px-2 lg:px-3 grid grid-cols-[100px_1fr_40px] lg:grid-cols-[120px_1fr_50px] gap-1 items-center w-full flex-1 min-h-[32px] max-h-[40px] anim-item shrink-0" data-id="${data.noUrut || actualIndex}">
          <div class="flex items-center text-left">
            <span class="text-[10px] lg:text-[11px] font-bold text-white uppercase rank-text leading-none">${rankStr}</span>
          </div>
          <div class="flex justify-center items-center gap-1.5 lg:gap-2">
             <div onclick="toggleFollow('${displayNo}')" class="no-box ${followClass} px-1.5 py-0.5 h-[20px] min-w-[24px]" title="Klik untuk mengikuti/menandai peserta">
                <span class="text-[11px] font-bold leading-none">${starHtml}</span>
             </div>
             <div class="w-[14px] flex items-center justify-center">
                ${indicatorHtml}
             </div>
          </div>
          <div class="flex items-center justify-end">
            <span class="text-[12px] lg:text-[14px] font-black text-[#60a5fa] leading-none">${data.totalNilai || '0'}</span>
          </div>
        </div>
      `;
    }

    function applyFlipAnimation(container, htmlContent) {
      const oldPositions = {};
      const oldNodes = container.querySelectorAll('.anim-item');
      oldNodes.forEach(node => { oldPositions[node.dataset.id] = node.getBoundingClientRect().top; });
      container.innerHTML = htmlContent;
      const newNodes = container.querySelectorAll('.anim-item');
      newNodes.forEach(node => {
        const id = node.dataset.id;
        if (oldPositions[id] !== undefined) {
          const newPos = node.getBoundingClientRect().top;
          const deltaY = oldPositions[id] - newPos;
          if (deltaY !== 0) {
            node.style.transform = `translateY(${deltaY}px)`;
            node.style.transition = 'none';
            requestAnimationFrame(() => {
              node.style.transform = '';
              node.style.transition = 'transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)';
            });
          }
        }
      });
    }

    function renderCategorySMP() {
      const items = (liveData['smp'] || []).slice(0, tabLimits['smp']);
      if (items.length === 0) return;

      const top3 = items.slice(0, 3);
      const remainingItems = items.slice(3);

      let podiumHtml = '';
      for(let i=0; i<3; i++) podiumHtml += buildCard(top3[i], 'smp', i, true);
      document.getElementById('podium-smp').innerHTML = podiumHtml;

      const col1Items = remainingItems.slice(0, 7);
      const col2Items = remainingItems.slice(7, 13);

      let col1Html = ''; col1Items.forEach((item, idx) => { col1Html += buildCard(item, 'smp', idx + 3, false); });
      applyFlipAnimation(document.getElementById('list-smp-col1'), col1Html);

      let col2Html = ''; col2Items.forEach((item, idx) => { col2Html += buildCard(item, 'smp', (idx + 3) + 7, false); });
      applyFlipAnimation(document.getElementById('list-smp-col2'), col2Html);
    }

    function renderCategorySMA() {
      const items = (liveData['sma'] || []).slice(0, tabLimits['sma']);
      if (items.length === 0) return;

      const top3 = items.slice(0, 3);
      const remainingItems = items.slice(3);

      let podiumHtml = '';
      for(let i=0; i<3; i++) podiumHtml += buildCard(top3[i], 'sma', i, true);
      document.getElementById('podium-sma').innerHTML = podiumHtml;

      const col1Items = remainingItems.slice(0, 15);
      const col2Items = remainingItems.slice(15, 30);

      let col1Html = ''; col1Items.forEach((item, idx) => { col1Html += buildCard(item, 'sma', idx + 3, false); });
      applyFlipAnimation(document.getElementById('list-sma-col1'), col1Html);

      let col2Html = ''; col2Items.forEach((item, idx) => { col2Html += buildCard(item, 'sma', (idx + 3) + 15, false); });
      applyFlipAnimation(document.getElementById('list-sma-col2'), col2Html);
    }

    function triggerScreenFlash(callback) {
      const flashEl = document.getElementById('screen-flash');
      flashEl.classList.remove('is-flashing'); void flashEl.offsetWidth; flashEl.classList.add('is-flashing');
      setTimeout(() => { if(callback) callback(); }, 500); 
    }

    function triggerConfetti() {
      const duration = 3 * 1000; const animationEnd = Date.now() + duration; const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 9999 };
      function randomInRange(min, max) { return Math.random() * (max - min) + min; }
      const interval = setInterval(function() {
        const timeLeft = animationEnd - Date.now(); if (timeLeft <= 0) return clearInterval(interval);
        const particleCount = 50 * (timeLeft / duration);
        confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
        confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
      }, 250);
    }

    function updateClocks() {
      const now = new Date(); 
      const timeStr = now.toLocaleTimeString('id-ID', { hour12: false });
      document.getElementById('live-realtime-clock').innerText = timeStr;
      if(document.getElementById('live-realtime-clock-mobile')) {
         document.getElementById('live-realtime-clock-mobile').innerText = timeStr;
      }
    }
    setInterval(updateClocks, 1000); updateClocks();

    async function fetchData() {
      if(isUpdating) return;
      isUpdating = true;
      try {
        const response = await fetch(GAS_API_URL);
        const data = await response.json();
        
        let hasStructuralChange = false; let hasTop3Change = false;
        ['smp', 'sma'].forEach(cat => {
          let catData = data[cat] || [];
          
          if(catData.length > 0 && (
             String(catData[0].rank).toUpperCase() === 'RANK' || 
             String(catData[0].totalNilai).toUpperCase().includes('TOTAL')
          )) {
             catData.shift();
          }

          const limit = tabLimits[cat]; 
          const currentItems = catData.slice(0, limit);
          
          const fullSig = currentItems.map(item => `${item.rank}:${item.totalNilai}:${item.noUrut}`).join('|');
          if (previousFullSignature[cat] !== fullSig && previousFullSignature[cat] !== "") {
            hasStructuralChange = true;
            const oldTop3Sig = previousFullSignature[cat].split('|').slice(0,3).join('|');
            const newTop3Sig = fullSig.split('|').slice(0,3).join('|');
            if(oldTop3Sig !== newTop3Sig) hasTop3Change = true;
          }
          previousFullSignature[cat] = fullSig;
          
          data[cat] = currentItems;
        });

        if(data.lastSync && data.lastSync !== lastDataSyncTime) {
           lastDataSyncTime = data.lastSync;
           const syncDate = new Date(data.lastSync);
           document.getElementById('last-update-clock').innerText = `Last Sync: ${syncDate.toLocaleTimeString('id-ID', { hour12: false })} WIB`;
        }

        if (hasStructuralChange) {
           triggerScreenFlash(() => { liveData = data; renderCategorySMP(); renderCategorySMA(); if(hasTop3Change) triggerConfetti(); });
        } else {
           liveData = data; renderCategorySMP(); renderCategorySMA();
        }
      } catch (error) { console.error("Gagal sinkronisasi data:", error); } finally { isUpdating = false; }
    }
    fetchData(); setInterval(fetchData, 4000);
  </script>
</body>
