<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIVERANK LKBB PENDEKAR 2026</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            brand: { 900: '#060813', 800: '#0a0d1c', 700: '#11162b', card: '#0f1423' }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background: radial-gradient(circle at top center, #11162b 0%, #060813 100%);
      color: #e2e8f0;
      height: 100vh;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    /* --- KEDIP LAYAR HALUS --- */
    .flash-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      box-shadow: inset 0 0 0 0 rgba(255, 255, 255, 0);
      pointer-events: none; z-index: 9999;
    }
    .is-flashing { animation: smoothGlow 2.5s ease-out; }
    @keyframes smoothGlow {
      0% { box-shadow: inset 0 0 0 0 rgba(255, 255, 255, 0); }
      30% { box-shadow: inset 0 0 0 40px rgba(255, 255, 255, 0.15); }
      100% { box-shadow: inset 0 0 0 0 rgba(255, 255, 255, 0); }
    }

    /* --- FLIP ANIMATION --- */
    .list-item { 
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); 
      position: relative;
    }

    /* Pastikan Rank Text Utuh Tanpa Terpotong (Anti-Ellipsis) */
    .rank-text {
      white-space: nowrap;
      overflow: visible;
      letter-spacing: 0.02em;
    }

    /* Desain Card */
    .rank-card {
      background: rgba(15, 20, 35, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 6px;
    }
    .podium-card { background: rgba(15, 20, 35, 0.8); border-radius: 8px; }
    .top1-glow { border: 1px solid rgba(250, 204, 21, 0.3); }
    .top2-glow { border: 1px solid rgba(148, 163, 184, 0.3); }
    .top3-glow { border: 1px solid rgba(217, 119, 6, 0.3); }

    /* Kotak Nomor Tampil */
    .no-box {
      border: 1px solid rgba(96, 165, 250, 0.35);
      border-radius: 6px;
      background: rgba(96, 165, 250, 0.08);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 6px;
      min-width: 26px;
      height: 20px; /* Kunci tinggi kotak agar proporsional */
    }

    /* Gradasi Teks */
    .text-gradient { background: linear-gradient(to right, #ffffff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .text-gradient-blue { background: linear-gradient(to right, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .no-scroll { overflow: hidden; }
  </style>
</head>
<body class="flex flex-col p-2 lg:p-4">

  <div id="screen-flash" class="flash-overlay"></div>

  <!-- OVERLAY SPONSOR MANUAL / AUTO 15 MNT -->
  <div id="sponsor-overlay" class="fixed inset-0 z-[100] bg-brand-900/95 backdrop-blur-xl flex flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity duration-700">
    <h2 class="text-sm font-black text-slate-500 tracking-[0.3em] uppercase mb-12">OUR PROUD SPONSORS</h2>
    <div id="sponsor-content" class="flex flex-col items-center text-center transition-opacity duration-500" style="opacity: 0;">
      <img id="sponsor-img" src="" alt="Sponsor" class="h-40 md:h-56 object-contain mb-8">
      <h3 id="sponsor-name" class="text-3xl md:text-5xl font-black text-white tracking-widest uppercase text-gradient mb-4"></h3>
      <p id="sponsor-desc" class="text-base md:text-xl text-slate-400 font-medium"></p>
    </div>
    <button onclick="hidePromo()" class="absolute top-8 right-8 text-white/30 hover:text-white/80 text-3xl transition-colors"><i class="fa-solid fa-xmark"></i></button>
  </div>

  <!-- HEADER -->
  <header class="flex items-center justify-between mb-3 bg-brand-800/50 border border-white/5 rounded-2xl p-3 shadow-lg shrink-0 h-[72px]">
    <div class="flex items-center gap-4 h-full">
      <img src="logo-pendekar.png" alt="Logo Pendekar" class="h-10 object-contain">
      <div class="flex flex-col justify-center">
        <div class="inline-flex items-center gap-2 bg-white/5 border border-white/10 rounded-full px-2 py-0.5 mb-1">
          <span class="relative flex h-1.5 w-1.5"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span><span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-emerald-500"></span></span>
          <span class="text-[9px] font-bold tracking-widest text-emerald-400 uppercase">SYSTEM SYNCED</span>
        </div>
        <div class="text-[9px] text-slate-400 font-semibold" id="last-update-clock">Last Sync: --:--:-- WIB</div>
      </div>
    </div>

    <div class="text-center flex-1">
      <h1 class="text-2xl lg:text-3xl font-black tracking-tight text-gradient leading-none mb-1">
        LIVE RANK LKBB PENDEKAR <span class="text-gradient-blue">2026</span>
      </h1>
      <div class="text-[9px] font-bold text-slate-500 tracking-[0.2em] uppercase">SUPPORTED BY REKAP ANDALAN</div>
    </div>

    <div class="flex items-center gap-4 h-full text-right">
      <div class="text-lg lg:text-xl font-black text-white tracking-wider" id="live-realtime-clock">00:00:00</div>
      <img src="https://lh3.googleusercontent.com/d/1UHSI3CLB0YCZ7uQ3O0sVIGMrVeK7qrK0=s1000" alt="Rekap Andalan" class="h-10 object-contain">
    </div>
  </header>

  <!-- KONTEN UTAMA: 2 KOLOM BESAR (SMP & SMA) -->
  <main class="flex-1 grid grid-cols-1 lg:grid-cols-2 gap-3 lg:gap-4 no-scroll pb-1">
    
    <!-- ==================== KOLOM SMP ==================== -->
    <div class="flex flex-col h-full bg-brand-800/30 rounded-2xl border border-white/5 p-2.5 shadow-xl">
      <h2 class="text-center text-base lg:text-lg font-black text-white tracking-[0.1em] uppercase mb-2 shrink-0">SMP / MTs</h2>
      
      <!-- PODIUM TOP 3 SMP -->
      <div id="podium-smp" class="grid grid-cols-3 gap-2 mb-2 shrink-0"></div>
      
      <!-- LIST SISA SMP -->
      <div class="flex-1 flex min-h-0 gap-2.5 pt-1 border-t border-white/5">
         
         <!-- KOLOM KIRI (7 Baris) -->
         <div class="flex-1 flex flex-col min-h-0">
            <div class="flex items-center text-[9px] font-bold text-slate-500 uppercase tracking-widest px-2 mb-1.5 shrink-0 bg-white/5 rounded py-1">
               <div class="w-[95px] shrink-0">RANK</div>
               <div class="flex-1 text-center pr-3">NO. TAMPIL</div>
               <div class="w-[35px] shrink-0 text-right">TOTAL</div>
            </div>
            <!-- Gunakan flex-col biasa dengan gap, HAPUS justify-between & flex-1 di children -->
            <div id="list-smp-col1" class="w-full flex flex-col gap-[3px] relative"></div>
         </div>

         <!-- KOLOM KANAN (6 Baris) -->
         <div class="flex-1 flex flex-col min-h-0">
            <div class="flex items-center text-[9px] font-bold text-slate-500 uppercase tracking-widest px-2 mb-1.5 shrink-0 bg-white/5 rounded py-1">
               <div class="w-[95px] shrink-0">RANK</div>
               <div class="flex-1 text-center pr-3">NO. TAMPIL</div>
               <div class="w-[35px] shrink-0 text-right">TOTAL</div>
            </div>
            <div id="list-smp-col2" class="w-full flex flex-col gap-[3px] relative"></div>
         </div>

      </div>
    </div>

    <!-- ==================== KOLOM SMA ==================== -->
    <div class="flex flex-col h-full bg-brand-800/30 rounded-2xl border border-white/5 p-2.5 shadow-xl">
      <h2 class="text-center text-base lg:text-lg font-black text-white tracking-[0.1em] uppercase mb-2 shrink-0">SMA / SMK / MA</h2>
      
      <!-- PODIUM TOP 3 SMA -->
      <div id="podium-sma" class="grid grid-cols-3 gap-2 mb-2 shrink-0"></div>
      
      <!-- LIST SISA SMA -->
      <div class="flex-1 flex min-h-0 gap-2.5 pt-1 border-t border-white/5">
         
         <!-- KOLOM KIRI (15 Baris) -->
         <div class="flex-1 flex flex-col min-h-0">
            <div class="flex items-center text-[9px] font-bold text-slate-500 uppercase tracking-widest px-2 mb-1 shrink-0 bg-white/5 rounded py-0.5">
               <div class="w-[95px] shrink-0">RANK</div>
               <div class="flex-1 text-center pr-3">NO. TAMPIL</div>
               <div class="w-[35px] shrink-0 text-right">TOTAL</div>
            </div>
            <!-- HAPUS justify-between, gunakan gap konstan agar card tidak meregang besar -->
            <div id="list-sma-col1" class="w-full flex flex-col gap-[3px] relative"></div>
         </div>

         <!-- KOLOM KANAN (15 Baris) -->
         <div class="flex-1 flex flex-col min-h-0">
            <div class="flex items-center text-[9px] font-bold text-slate-500 uppercase tracking-widest px-2 mb-1 shrink-0 bg-white/5 rounded py-0.5">
               <div class="w-[95px] shrink-0">RANK</div>
               <div class="flex-1 text-center pr-3">NO. TAMPIL</div>
               <div class="w-[35px] shrink-0 text-right">TOTAL</div>
            </div>
            <div id="list-sma-col2" class="w-full flex flex-col gap-[3px] relative"></div>
         </div>

      </div>
    </div>

  </main>

  <button onclick="showPromo()" class="fixed bottom-3 right-3 opacity-10 hover:opacity-100 bg-white/10 p-2 rounded-full text-white transition-all z-[90]">
    <i class="fa-solid fa-star"></i>
  </button>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzTSP4qFth4q0Ufjbag-uq_WFh2-jHvQ0RY9w4e8oemtdwlw_PPL99z3FZ7Aec1-C4h/exec";

    const sponsorData = [
      { logo: "https://lh3.googleusercontent.com/d/185LBG7napo7sSUDR29NBOi179fN1dbep=s1000", nama: "TJOBRUT STORE", deskripsi: "Pusat Atribut Paskibra Terlengkap dan Termurah" },
      { logo: "https://lh3.googleusercontent.com/d/1S8ycvcUE99tn-w7TKXPJ5lRlbWowuwIb=s1000", nama: "COSMO ATRIBUT", deskripsi: "" }
    ];

    let promoTimer = null; let promoIsActive = false;
    function showPromo() {
      if(sponsorData.length === 0 || promoIsActive) return;
      promoIsActive = true;
      const overlay = document.getElementById('sponsor-overlay'); const content = document.getElementById('sponsor-content');
      overlay.classList.remove('opacity-0', 'pointer-events-none'); overlay.classList.add('opacity-100');
      let idx = 0;
      function showNextSponsor() {
        if(idx >= sponsorData.length || !promoIsActive) { hidePromo(); return; }
        content.style.opacity = 0;
        setTimeout(() => {
          document.getElementById('sponsor-img').src = sponsorData[idx].logo;
          document.getElementById('sponsor-name').innerText = sponsorData[idx].nama;
          const descEl = document.getElementById('sponsor-desc');
          descEl.innerText = sponsorData[idx].deskripsi; descEl.style.display = sponsorData[idx].deskripsi ? "block" : "none";
          content.style.opacity = 1; idx++;
          promoTimer = setTimeout(showNextSponsor, 5000);
        }, 500);
      }
      showNextSponsor();
    }
    function hidePromo() {
      promoIsActive = false; clearTimeout(promoTimer);
      const overlay = document.getElementById('sponsor-overlay');
      overlay.classList.remove('opacity-100'); overlay.classList.add('opacity-0', 'pointer-events-none');
    }
    setInterval(showPromo, 15 * 60 * 1000);

    let liveData = { smp: [], sma: [] };
    let previousFullSignature = { smp: "", sma: "" };
    let teamRankTracker = { smp: {}, sma: {} };
    const tabLimits = { smp: 16, sma: 33 };
    let lastDataSyncTime = 0; let isUpdating = false;

    function getIndicatorData(cat, item, currentIndex) {
      if (!item || !item.totalNilai || item.totalNilai <= 0) return `<span class="text-slate-500 font-bold text-[10px]">—</span>`;
      
      const teamKey = item.noUrut;
      if (!teamRankTracker[cat]) teamRankTracker[cat] = {};
      const prevData = teamRankTracker[cat][teamKey];

      let status = 'same';
      if (prevData !== undefined) {
        if (currentIndex < prevData.rankIndex) { status = 'up'; } 
        else if (currentIndex > prevData.rankIndex) { status = 'down'; } 
        else { status = 'same'; }
      }
      teamRankTracker[cat][teamKey] = { rankIndex: currentIndex, status: status };

      if (status === 'up') return `<span class="text-[#10b981] font-black text-[10px] leading-none">▲</span>`;
      if (status === 'down') return `<span class="text-[#ef4444] font-black text-[10px] leading-none">▼</span>`;
      return `<span class="text-slate-500 font-bold text-[10px]">—</span>`;
    }

    // Builder Card 
    function buildCard(item, cat, actualIndex, isPodium = false) {
      const data = item || { rank: actualIndex+1, totalNilai: '0', noUrut: '-' };
      const indicatorHtml = getIndicatorData(cat, data, actualIndex);
      
      let displayNo = data.noUrut;
      if (!isNaN(displayNo) && displayNo !== '-' && displayNo > 0 && displayNo < 10) { displayNo = '0' + displayNo; }
      
      const rankStr = data.rank || (actualIndex + 1);

      if (isPodium) {
        let glowClass = 'podium-card px-2 py-1.5 h-[48px] flex flex-col justify-between list-item w-full shrink-0';
        if(actualIndex === 0) glowClass += ' top1-glow';
        if(actualIndex === 1) glowClass += ' top2-glow';
        if(actualIndex === 2) glowClass += ' top3-glow';
        const trophy = ['🏆','🥈','🥉'][actualIndex] || '';

        return `
          <div class="${glowClass}" data-id="${data.noUrut || actualIndex}">
            <div class="flex justify-between items-center w-full px-1">
               <span class="text-[10px] font-bold text-white rank-text uppercase">${trophy} ${rankStr}</span>
            </div>
            <div class="flex justify-between items-center w-full px-1 mt-0.5">
               <div class="no-box">
                  <span class="text-[11px] font-bold text-white leading-none">${displayNo}</span>
               </div>
               <div class="flex items-center gap-1.5">
                  <div class="w-[12px] text-center flex items-center justify-center">${indicatorHtml}</div>
                  <span class="text-[13px] font-black text-[#60a5fa] leading-none">${data.totalNilai || '0'}</span>
               </div>
            </div>
          </div>
        `;
      }

      // Card List Biasa - Tinggi dikunci h-[30px] agar tidak meregang
      return `
        <div class="rank-card px-2 flex items-center w-full h-[30px] justify-between list-item shrink-0" data-id="${data.noUrut || actualIndex}">
          <!-- KIRI: RANK UTUH (w-[95px]) -->
          <div class="w-[95px] shrink-0 flex items-center">
            <span class="text-[9px] font-bold text-white uppercase rank-text leading-none">${rankStr}</span>
          </div>
          
          <!-- TENGAH: NO TAMPIL & INDIKATOR -->
          <div class="flex-1 flex justify-center items-center gap-1.5 pr-2">
             <div class="no-box">
                <span class="text-[10px] font-bold text-white leading-none">${displayNo}</span>
             </div>
             <div class="w-[12px] shrink-0 flex items-center justify-center">
                ${indicatorHtml}
             </div>
          </div>
          
          <!-- KANAN: TOTAL NILAI -->
          <div class="w-[35px] shrink-0 flex items-center justify-end pr-0.5">
            <span class="text-[11px] font-black text-[#60a5fa] leading-none">${data.totalNilai || '0'}</span>
          </div>
        </div>
      `;
    }

    function applyFlipAnimation(container, htmlContent) {
      const oldPositions = {};
      const oldNodes = container.querySelectorAll('.list-item');
      oldNodes.forEach(node => { oldPositions[node.dataset.id] = node.getBoundingClientRect().top; });
      container.innerHTML = htmlContent;
      const newNodes = container.querySelectorAll('.list-item');
      newNodes.forEach(node => {
        const id = node.dataset.id;
        if (oldPositions[id] !== undefined) {
          const newPos = node.getBoundingClientRect().top;
          const deltaY = oldPositions[id] - newPos;
          if (deltaY !== 0) {
            node.style.transform = `translateY(${deltaY}px)`;
            node.style.transition = 'none';
            requestAnimationFrame(() => {
              node.style.transform = '';
              node.style.transition = 'transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)';
            });
          }
        }
      });
    }

    function renderCategorySMP() {
      const items = (liveData['smp'] || []).slice(0, tabLimits['smp']);
      if (items.length === 0) return;

      const top3 = items.slice(0, 3);
      const remainingItems = items.slice(3);

      let podiumHtml = '';
      for(let i=0; i<3; i++) podiumHtml += buildCard(top3[i], 'smp', i, true);
      document.getElementById('podium-smp').innerHTML = podiumHtml;

      const col1Items = remainingItems.slice(0, 7);
      const col2Items = remainingItems.slice(7, 13);

      let col1Html = ''; col1Items.forEach((item, idx) => { col1Html += buildCard(item, 'smp', idx + 3, false); });
      applyFlipAnimation(document.getElementById('list-smp-col1'), col1Html);

      let col2Html = ''; col2Items.forEach((item, idx) => { col2Html += buildCard(item, 'smp', (idx + 3) + 7, false); });
      applyFlipAnimation(document.getElementById('list-smp-col2'), col2Html);
    }

    function renderCategorySMA() {
      const items = (liveData['sma'] || []).slice(0, tabLimits['sma']);
      if (items.length === 0) return;

      const top3 = items.slice(0, 3);
      const remainingItems = items.slice(3);

      let podiumHtml = '';
      for(let i=0; i<3; i++) podiumHtml += buildCard(top3[i], 'sma', i, true);
      document.getElementById('podium-sma').innerHTML = podiumHtml;

      const col1Items = remainingItems.slice(0, 15);
      const col2Items = remainingItems.slice(15, 30);

      let col1Html = ''; col1Items.forEach((item, idx) => { col1Html += buildCard(item, 'sma', idx + 3, false); });
      applyFlipAnimation(document.getElementById('list-sma-col1'), col1Html);

      let col2Html = ''; col2Items.forEach((item, idx) => { col2Html += buildCard(item, 'sma', (idx + 3) + 15, false); });
      applyFlipAnimation(document.getElementById('list-sma-col2'), col2Html);
    }

    function triggerScreenFlash(callback) {
      const flashEl = document.getElementById('screen-flash');
      flashEl.classList.remove('is-flashing'); void flashEl.offsetWidth; flashEl.classList.add('is-flashing');
      setTimeout(() => { if(callback) callback(); }, 500); 
    }

    function triggerConfetti() {
      const duration = 3 * 1000; const animationEnd = Date.now() + duration; const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 9999 };
      function randomInRange(min, max) { return Math.random() * (max - min) + min; }
      const interval = setInterval(function() {
        const timeLeft = animationEnd - Date.now(); if (timeLeft <= 0) return clearInterval(interval);
        const particleCount = 50 * (timeLeft / duration);
        confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
        confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
      }, 250);
    }

    function updateClocks() {
      const now = new Date(); document.getElementById('live-realtime-clock').innerText = now.toLocaleTimeString('id-ID', { hour12: false });
    }
    setInterval(updateClocks, 1000); updateClocks();

    async function fetchData() {
      if(isUpdating) return;
      isUpdating = true;
      try {
        const response = await fetch(GAS_API_URL);
        const data = await response.json();
        
        let hasStructuralChange = false; let hasTop3Change = false;
        ['smp', 'sma'].forEach(cat => {
          const limit = tabLimits[cat]; const currentItems = (data[cat] || []).slice(0, limit);
          const fullSig = currentItems.map(item => `${item.rank}:${item.totalNilai}:${item.noUrut}`).join('|');
          if (previousFullSignature[cat] !== fullSig && previousFullSignature[cat] !== "") {
            hasStructuralChange = true;
            const oldTop3Sig = previousFullSignature[cat].split('|').slice(0,3).join('|');
            const newTop3Sig = fullSig.split('|').slice(0,3).join('|');
            if(oldTop3Sig !== newTop3Sig) hasTop3Change = true;
          }
          previousFullSignature[cat] = fullSig;
        });

        if(data.lastSync && data.lastSync !== lastDataSyncTime) {
           lastDataSyncTime = data.lastSync;
           const syncDate = new Date(data.lastSync);
           document.getElementById('last-update-clock').innerText = `Last Sync: ${syncDate.toLocaleTimeString('id-ID', { hour12: false })} WIB`;
        }

        if (hasStructuralChange) {
           triggerScreenFlash(() => { liveData = data; renderCategorySMP(); renderCategorySMA(); if(hasTop3Change) triggerConfetti(); });
        } else {
           liveData = data; renderCategorySMP(); renderCategorySMA();
        }
      } catch (error) { console.error("Gagal sinkronisasi data:", error); } finally { isUpdating = false; }
    }
    fetchData(); setInterval(fetchData, 4000);
  </script>
</body>
</html>
