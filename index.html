  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },

  <style>
    body {
      background: radial-gradient(circle at top center, #11162b 0%, #060813 100%);
      color: #e2e8f0;
      height: 100vh;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    /* --- KEDIP LAYAR HALUS --- */
    .flash-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      box-shadow: inset 0 0 0 0 rgba(255, 255, 255, 0);
      pointer-events: none; z-index: 9999;
    }
    .is-flashing { animation: smoothGlow 2.5s ease-out; }
    @keyframes smoothGlow {
      0% { box-shadow: inset 0 0 0 0 rgba(255, 255, 255, 0); }
      30% { box-shadow: inset 0 0 0 40px rgba(255, 255, 255, 0.15); }
      100% { box-shadow: inset 0 0 0 0 rgba(255, 255, 255, 0); }
    }

    /* --- ANIMASI & HOVER --- */
    .anim-item { 
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); 
      position: relative;
    }
    
    .hover-sorot:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: scale(1.02) translateX(4px);
      z-index: 10;
      border-color: rgba(96, 165, 250, 0.5);
      box-shadow: 0 4px 20px rgba(96, 165, 250, 0.2);
    }

    /* Anti Terpotong */
    .rank-text {
      white-space: nowrap;
      overflow: visible;
      letter-spacing: 0.02em;
    }

    /* Desain Card */
    .rank-card {
      background: rgba(15, 20, 35, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 6px;
    }
    .podium-card { background: rgba(15, 20, 35, 0.8); border-radius: 8px; }
    .top1-glow { border: 1px solid rgba(250, 204, 21, 0.3); }
    .top2-glow { border: 1px solid rgba(148, 163, 184, 0.3); }
    .top3-glow { border: 1px solid rgba(217, 119, 6, 0.3); }

    /* Kotak Nomor Tampil Standar */
    .no-box {
      border: 1px solid rgba(96, 165, 250, 0.35);
      border-radius: 4px;
      background: rgba(96, 165, 250, 0.08);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .no-box:hover { background: rgba(96, 165, 250, 0.3); transform: scale(1.1); }

    /* Kotak Nomor Favorit (Bintang) */
    .fav-box {
      border: 1px solid rgba(250, 204, 21, 0.6);
      border-radius: 4px;
      background: rgba(250, 204, 21, 0.2);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fde047;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(250, 204, 21, 0.3);
      transition: all 0.2s;
    }
    .fav-box:hover { background: rgba(250, 204, 21, 0.4); transform: scale(1.1); }

    /* Gradasi Teks */
    .text-gradient { background: linear-gradient(to right, #ffffff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .text-gradient-blue { background: linear-gradient(to right, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    /* Layout HP & Scroll Area */
    .mobile-hidden { display: none !important; }
    
    @media (min-width: 1024px) {
      .mobile-hidden { display: flex !important; }
    }
    
    @media (max-width: 1023px) {
      .mobile-scroll { 
         overflow-y: auto; 
         overflow-x: hidden; 
         /* Memberi ruang kosong di bawah agar baris terakhir tidak tertutup tombol promo */
         padding-bottom: 80px !important; 
      }
    }
  </style>
</head>

  <script>
    // ==========================================
    // 1. LINK DATA SPREADSHEET (GAS API)
    // ==========================================
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzTSP4qFth4q0Ufjbag-uq_WFh2-jHvQ0RY9w4e8oemtdwlw_PPL99z3FZ7Aec1-C4h/exec";

    // ==========================================
    // 2. KONFIGURASI SPONSOR / ORGANIZER
    // ==========================================
    const promoConfig = [
      {
        category: "ORGANIZED BY",
        items: [
          { logo: "logo-pendekar.png", nama: "PASKIBRA X", deskripsi: "Penyelenggara Utama Event LKBB Pendekar" }
        ]
      },
      {
        category: "SUPPORTED BY",
        items: [
          { logo: "https://lh3.googleusercontent.com/d/1UHSI3CLB0YCZ7uQ3O0sVIGMrVeK7qrK0=s1000", nama: "REKAP ANDALAN", deskripsi: "Platform Live Ranking System Event Kreatif" }
        ]
      },
      {
        category: "SPONSORED BY",
        items: [
          { logo: "https://lh3.googleusercontent.com/d/185LBG7napo7sSUDR29NBOi179fN1dbep=s1000", nama: "TJOBRUT STORE", deskripsi: "Pusat Atribut Paskibra Terlengkap dan Termurah" },
          { logo: "https://lh3.googleusercontent.com/d/1S8ycvcUE99tn-w7TKXPJ5lRlbWowuwIb=s1000", nama: "COSMO ATRIBUT", deskripsi: "Grosir Perlengkapan & Seragam" }
        ]
      }
    ];

    // ==========================================
    // LOGIKA TAB HP & PENANDA FAVORIT BINTANG
    // ==========================================
    
    function switchTab(tab) {
       document.getElementById('col-smp').classList.toggle('mobile-hidden', tab !== 'smp');
       document.getElementById('col-sma').classList.toggle('mobile-hidden', tab !== 'sma');
       
       const btnSmp = document.getElementById('btn-tab-smp');
       const btnSma = document.getElementById('btn-tab-sma');
       if(tab === 'smp') {
          btnSmp.className = "flex-1 py-2 text-xs font-bold rounded-lg transition-colors bg-blue-600 text-white shadow-lg";
          btnSma.className = "flex-1 py-2 text-xs font-bold rounded-lg transition-colors bg-white/5 text-slate-400 border border-white/10";
       } else {
          btnSma.className = "flex-1 py-2 text-xs font-bold rounded-lg transition-colors bg-blue-600 text-white shadow-lg";
          btnSmp.className = "flex-1 py-2 text-xs font-bold rounded-lg transition-colors bg-white/5 text-slate-400 border border-white/10";
       }
    }

    let favoriteSet = new Set();
    
    function toggleFavorite(cat, id) {
       event.stopPropagation();
       const key = cat + '-' + id;
       
       if (favoriteSet.has(key)) {
           if(confirm("Berhenti menandai peserta nomor " + id + " sebagai favorit?")) {
               favoriteSet.delete(key);
               renderCategorySMP(); renderCategorySMA();
           }
       } else {
           if(confirm("Ikuti (Tandai Bintang) peserta nomor " + id + "?")) {
               favoriteSet.add(key);
               renderCategorySMP(); renderCategorySMA();
           }
       }
    }

    // ==========================================
    // LOGIKA RENDER CARD
    // ==========================================
    let liveData = { smp: [], sma: [] };
    let previousFullSignature = { smp: "", sma: "" };
    let teamRankTracker = { smp: {}, sma: {} };
    const tabLimits = { smp: 16, sma: 33 };
    let lastDataSyncTime = 0; let isUpdating = false;

    function getIndicatorData(cat, item, currentIndex) {
      if (!item || !item.totalNilai || item.totalNilai <= 0) return `<span class="text-slate-500 font-bold text-[11px] lg:text-[13px]">—</span>`;
      
      const teamKey = item.noUrut;
      if (!teamRankTracker[cat]) teamRankTracker[cat] = {};
      const prevData = teamRankTracker[cat][teamKey];

      let status = 'same';
      if (prevData !== undefined) {
        if (currentIndex < prevData.rankIndex) { status = 'up'; } 
        else if (currentIndex > prevData.rankIndex) { status = 'down'; } 
      }
      teamRankTracker[cat][teamKey] = { rankIndex: currentIndex, status: status };

      if (status === 'up') return `<span class="text-[#10b981] font-black text-[11px] lg:text-[13px] leading-none">▲</span>`;
      if (status === 'down') return `<span class="text-[#ef4444] font-black text-[11px] lg:text-[13px] leading-none">▼</span>`;
      return `<span class="text-slate-500 font-bold text-[11px] lg:text-[13px]">—</span>`;
    }

    function buildCard(item, cat, actualIndex, isPodium = false) {
      const data = item || { rank: actualIndex+1, totalNilai: '0', noUrut: '-' };
      const indicatorHtml = getIndicatorData(cat, data, actualIndex);
      
      let displayNo = data.noUrut;
      if (!isNaN(displayNo) && displayNo !== '-' && displayNo > 0 && displayNo < 10) { displayNo = '0' + parseInt(displayNo); }
      
      const rankStr = data.rank || (actualIndex + 1);
      
      const favKey = cat + '-' + displayNo;
      const isFav = favoriteSet.has(favKey);

      let noBoxHtml = isFav 
        ? `<div onclick="toggleFavorite('${cat}', '${displayNo}')" class="fav-box px-1 lg:px-1.5 h-[18px] lg:h-[22px] min-w-[24px] lg:min-w-[30px]" title="Hapus Favorit">
             <i class="fa-solid fa-star text-[9px] lg:text-[10px] mr-1"></i>
             <span class="text-[11px] lg:text-[13px] font-bold leading-none">${displayNo}</span>
           </div>`
        : `<div onclick="toggleFavorite('${cat}', '${displayNo}')" class="no-box px-1 lg:px-1.5 h-[18px] lg:h-[22px] min-w-[24px] lg:min-w-[30px]" title="Klik untuk ikuti">
             <span class="text-[11px] lg:text-[13px] font-bold text-white leading-none">${displayNo}</span>
           </div>`;

      if (isPodium) {
        let glowClass = 'podium-card px-3 py-2 h-[50px] lg:h-[60px] flex flex-col justify-between anim-item hover-sorot w-full shrink-0';
        if(actualIndex === 0) glowClass += ' top1-glow';
        if(actualIndex === 1) glowClass += ' top2-glow';
        if(actualIndex === 2) glowClass += ' top3-glow';
        const trophy = ['🏆','🥈','🥉'][actualIndex] || '';

        return `
          <div class="${glowClass}" data-id="${data.noUrut || actualIndex}">
            <div class="flex justify-between items-center w-full px-1">
               <span class="text-[11px] lg:text-[13px] font-bold text-white rank-text uppercase">${trophy} ${rankStr}</span>
            </div>
            <div class="flex justify-between items-center w-full px-1 mt-0.5">
               ${noBoxHtml}
               <div class="flex items-center gap-1.5 lg:gap-2">
                  <div class="w-[14px] text-center flex items-center justify-center">${indicatorHtml}</div>
                  <span class="text-[14px] lg:text-[17px] font-black text-[#60a5fa] leading-none">${data.totalNilai || '0'}</span>
               </div>
            </div>
          </div>
        `;
      }

      return `
        <div class="rank-card hover-sorot px-3 grid grid-cols-[100px_1fr_45px] lg:grid-cols-[115px_1fr_50px] gap-1 items-center w-full flex-1 min-h-[28px] max-h-[45px] anim-item shrink-0" data-id="${data.noUrut || actualIndex}">
          <div class="flex items-center text-left">
            <span class="text-[10px] lg:text-[12px] font-bold text-white uppercase rank-text leading-none">${rankStr}</span>
          </div>
          <div class="flex justify-center items-center gap-2 lg:gap-3">
             ${noBoxHtml}
             <div class="w-[14px] flex items-center justify-center">
                ${indicatorHtml}
             </div>
          </div>
          <div class="flex items-center justify-end">
            <span class="text-[12px] lg:text-[15px] font-black text-[#60a5fa] leading-none">${data.totalNilai || '0'}</span>
          </div>
        </div>
      `;
    }

    function applyFlipAnimation(container, htmlContent) {
      const oldPositions = {};
      const oldNodes = container.querySelectorAll('.anim-item');
      oldNodes.forEach(node => { oldPositions[node.dataset.id] = node.getBoundingClientRect().top; });
      container.innerHTML = htmlContent;
      const newNodes = container.querySelectorAll('.anim-item');
      newNodes.forEach(node => {
        const id = node.dataset.id;
        if (oldPositions[id] !== undefined) {
          const newPos = node.getBoundingClientRect().top;
          const deltaY = oldPositions[id] - newPos;
          if (deltaY !== 0) {
            node.style.transform = `translateY(${deltaY}px)`;
            node.style.transition = 'none';
            requestAnimationFrame(() => {
              node.style.transform = '';
              node.style.transition = 'transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)';
            });
          }
        }
      });
    }

    function renderCategorySMP() {
      const items = (liveData['smp'] || []).slice(0, tabLimits['smp']);
      if (items.length === 0) return;
      const top3 = items.slice(0, 3); const remainingItems = items.slice(3);

      let podiumHtml = '';
      for(let i=0; i<3; i++) podiumHtml += buildCard(top3[i], 'smp', i, true);
      document.getElementById('podium-smp').innerHTML = podiumHtml;

      let col1Html = ''; remainingItems.slice(0, 7).forEach((item, idx) => { col1Html += buildCard(item, 'smp', idx + 3, false); });
      applyFlipAnimation(document.getElementById('list-smp-col1'), col1Html);

      let col2Html = ''; remainingItems.slice(7, 13).forEach((item, idx) => { col2Html += buildCard(item, 'smp', (idx + 3) + 7, false); });
      applyFlipAnimation(document.getElementById('list-smp-col2'), col2Html);
    }

    function renderCategorySMA() {
      const items = (liveData['sma'] || []).slice(0, tabLimits['sma']);
      if (items.length === 0) return;
      const top3 = items.slice(0, 3); const remainingItems = items.slice(3);

      let podiumHtml = '';
      for(let i=0; i<3; i++) podiumHtml += buildCard(top3[i], 'sma', i, true);
      document.getElementById('podium-sma').innerHTML = podiumHtml;

      let col1Html = ''; remainingItems.slice(0, 15).forEach((item, idx) => { col1Html += buildCard(item, 'sma', idx + 3, false); });
      applyFlipAnimation(document.getElementById('list-sma-col1'), col1Html);

      let col2Html = ''; remainingItems.slice(15, 30).forEach((item, idx) => { col2Html += buildCard(item, 'sma', (idx + 3) + 15, false); });
      applyFlipAnimation(document.getElementById('list-sma-col2'), col2Html);
    }

    function triggerScreenFlash(callback) {
      const flashEl = document.getElementById('screen-flash');
      flashEl.classList.remove('is-flashing'); void flashEl.offsetWidth; flashEl.classList.add('is-flashing');
      setTimeout(() => { if(callback) callback(); }, 500); 
    }
    function triggerConfetti() {
      const duration = 3000; const end = Date.now() + duration;
      (function frame() {
        confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, zIndex:9999 });
        confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, zIndex:9999 });
        if (Date.now() < end) requestAnimationFrame(frame);
      }());
    }

    function updateClocks() {
      const now = new Date(); const timeStr = now.toLocaleTimeString('id-ID', { hour12: false });
      document.querySelectorAll('.desktop-realtime-clock, .mobile-realtime-clock').forEach(el => el.innerText = timeStr);
    }
    setInterval(updateClocks, 1000); updateClocks();

    let promoTimer = null; let promoIsActive = false;
    let promoFlatList = [];
    promoConfig.forEach(cat => { cat.items.forEach(item => { promoFlatList.push({ ...item, catName: cat.category }); }); });

    function showPromo() {
      if(promoFlatList.length === 0 || promoIsActive) return;
      promoIsActive = true;
      const overlay = document.getElementById('sponsor-overlay'); const content = document.getElementById('sponsor-content');
      overlay.classList.remove('opacity-0', 'pointer-events-none'); overlay.classList.add('opacity-100');
      let idx = 0;
      function showNextSponsor() {
        if(idx >= promoFlatList.length || !promoIsActive) { hidePromo(); return; }
        content.style.opacity = 0;
        setTimeout(() => {
          document.getElementById('promo-category').innerText = promoFlatList[idx].catName;
          document.getElementById('sponsor-img').src = promoFlatList[idx].logo;
          document.getElementById('sponsor-name').innerText = promoFlatList[idx].nama;
          const descEl = document.getElementById('sponsor-desc');
          descEl.innerText = promoFlatList[idx].deskripsi; descEl.style.display = promoFlatList[idx].deskripsi ? "block" : "none";
          content.style.opacity = 1; idx++;
          promoTimer = setTimeout(showNextSponsor, 5000);
        }, 500);
      }
      showNextSponsor();
    }
    function hidePromo() {
      promoIsActive = false; clearTimeout(promoTimer);
      const overlay = document.getElementById('sponsor-overlay');
      overlay.classList.remove('opacity-100'); overlay.classList.add('opacity-0', 'pointer-events-none');
    }
    setInterval(showPromo, 15 * 60 * 1000);

    async function fetchData() {
      if(isUpdating) return;
      isUpdating = true;
      try {
        const response = await fetch(GAS_API_URL);
        const data = await response.json();
        
        let hasStructuralChange = false; let hasTop3Change = false;
        ['smp', 'sma'].forEach(cat => {
          let catData = data[cat] || [];
          if(catData.length > 0 && (String(catData[0].rank).toUpperCase() === 'RANK' || String(catData[0].totalNilai).toUpperCase().includes('TOTAL'))) {
             catData.shift();
          }
          const limit = tabLimits[cat]; const currentItems = catData.slice(0, limit);
          
          const fullSig = currentItems.map(item => `${item.rank}:${item.totalNilai}:${item.noUrut}`).join('|');
          if (previousFullSignature[cat] !== fullSig && previousFullSignature[cat] !== "") {
            hasStructuralChange = true;
            const oldTop3Sig = previousFullSignature[cat].split('|').slice(0,3).join('|');
            const newTop3Sig = fullSig.split('|').slice(0,3).join('|');
            if(oldTop3Sig !== newTop3Sig) hasTop3Change = true;
          }
          previousFullSignature[cat] = fullSig;
          data[cat] = currentItems;
        });

        if(data.lastSync && data.lastSync !== lastDataSyncTime) {
           lastDataSyncTime = data.lastSync;
           const syncStr = `Last Sync: ${new Date(data.lastSync).toLocaleTimeString('id-ID', { hour12: false })} WIB`;
           document.querySelectorAll('.desktop-last-update').forEach(el => el.innerText = syncStr);
           document.querySelectorAll('.mobile-last-update').forEach(el => el.innerText = `Sync: ${new Date(data.lastSync).toLocaleTimeString('id-ID', { hour12: false })}`);
        }

        if (hasStructuralChange) {
           triggerScreenFlash(() => { liveData = data; renderCategorySMP(); renderCategorySMA(); if(hasTop3Change) triggerConfetti(); });
        } else {
           liveData = data; renderCategorySMP(); renderCategorySMA();
        }
      } catch (error) { console.error("Gagal sinkronisasi data:", error); } finally { isUpdating = false; }
    }
    fetchData(); setInterval(fetchData, 4000);
  </script>
</body>
